name: unpack
on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace the repo contents with the project zip
        run: |
          set -e
          ZIP=$(ls -1 *.zip | head -n 1)
          echo "Unpacking $ZIP"
          git ls-files | grep -v '^\.github/' | grep -v '\.zip$' | xargs -r git rm -f -q
          unzip -o "$ZIP"
          rm -f ./*.zip
          git config user.name "unpack-bot"
          git config user.email "unpack-bot@users.noreply.github.com"
          git add -A
          git commit -m "Next.js project (unpacked from zip)" || echo "nothing to commit"
          git push origin HEAD:"${GITHUB_REF_NAME:-main}"
