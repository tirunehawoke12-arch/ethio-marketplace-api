    return new Promise((resolve,reject)=>{
      tgBox(`<div class="etm-tg-logo">✈️</div><h2>Telegram ማረጋገጫ</h2><p>አካውንቱን ለመክፈት Telegram እንዲሁም OTP ማረጋገጫ ያስፈልጋል።</p><div class="etm-tg-steps"><b>1</b><span>Telegram Bot ይክፈቱ እና <b>Start</b> ይጫኑ።</span><b>2</b><span>Bot የሚልከውን 6 አሃዝ OTP ይጠብቁ።</span><b>3</b><span>ኮዱን ከታች ያስገቡ።</span></div><a id="etmTGOpen" class="etm-tg-open" href="${escT(session.telegramUrl||'#')}" target="_blank" rel="noopener">✈️ Telegram Bot ክፈት / Start</a><div id="etmTGState" class="etm-tg-state">Bot እስኪጀምር በመጠባበቅ ላይ…</div><div id="etmTGCode" class="etm-tg-code" style="display:none"><input id="etmTGOTP" inputmode="numeric" maxlength="6" placeholder="6 አሃዝ OTP"><button id="etmTGVerify">✅ አረጋግጥ</button></div><button class="etm-tg-cancel" id="etmTGCancel">ሰርዝ</button>`);
      document.getElementById('etmTGCancel').onclick=()=>{tgClose();reject(new Error('cancelled'))};
      const state=document.getElementById('etmTGState'),code=document.getElementById('etmTGCode');

      };
      (async()=>{
        while(!stopped){
          await sleep(1800);
          try{
            const st=await api('/api/telegram/status',{requestId:session.requestId});

              code.style.display='flex'; state.textContent='✅ Telegram ተገናኝቷል። OTP ወደ Telegram ተልኳል።';

            }
          }catch(e){state.textContent='❌ '+e.message; stopped=true; break}
        }
      })();
    });
  }
  async function loginTelegram(email,phone){
    try{
      const s=await api('/api/telegram/login',{email,phone});
      return new Promise((resolve,reject)=>{
        tgBox(`<div class="etm-tg-logo">🔐</div><h2>Login OTP</h2><p>የማረጋገጫ ኮድ ወደ የተገናኘው Telegram ተልኳል።</p><div class="etm-tg-state">⏱ 5 ደቂቃ ውስጥ ይጠቀሙት።</div><div class="etm-tg-code"><input id="etmTGOTP" inputmode="numeric" maxlength="6" placeholder="6 አሃዝ OTP"><button id="etmTGVerify">✅ ግባ</button></div><button class="etm-tg-cancel" id="etmTGCancel">ሰርዝ</button>`);

        document.getElementById('etmTGOTP').focus();
      });
    }catch(e){
      if(e.message==='telegram_not_linked'){
        const v=await registerTelegram(email,phone);
        await api('/api/telegram/bind',{requestId:v.requestId,email,phone});
        return v;
      }
      throw e;
    }
  }
  window.ETM_Telegram_Register=registerTelegram;
  window.ETM_Telegram_Login=loginTelegram;
})();
